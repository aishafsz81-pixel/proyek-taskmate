<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aplikasi Manajemen Tugas Saya</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f9; padding: 20px; text-align: center; }
        .container { background: white; padding: 20px; max-width: 400px; margin: auto; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        input[type="text"] { width: 70%; padding: 10px; margin-right: 5px; border: 1px solid #ccc; border-radius: 4px; }
        button { padding: 10px; background-color: #28a745; color: white; border: none; border-radius: 4px; cursor: pointer; }
        ul { list-style-type: none; padding: 0; text-align: left; }
        li { padding: 10px; background: #eee; margin-top: 5px; border-radius: 4px; display: flex; justify-content: space-between; align-items: center; }
        .hapus-btn { color: red; text-decoration: none; font-weight: bold; }
    </style>
</head>
<body>
    <div class="container">
        <h2>Daftar Tugas Harian</h2>
        <form action="/tambah" method="POST">
            <input type="text" name="tugas" placeholder="Tulis tugas baru..." required>
            <button type="submit">Tambah</button>
        </form>
        <ul>
            {% for t in tugas %}
            <li>
                {{ t }} 
                <a href="/hapus/{{ loop.index0 }}" class="hapus-btn">X</a>
            </li>
            {% endfor %}
        </ul>
    </div>
</body>
</html>
